<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motos · Super Llantas</title>
  <meta name="description" content="Motos de motocross, enduro, trail y calle, con las medidas de llanta que usa cada una. Super Llantas, Cali.">
  <meta name="theme-color" content="#08080a">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="motos">
<main>
  <section class="phero">
    <div class="phero__wheel phero__wheel--moto" data-moto="cross"></div>
    <div class="wrap">
      <p class="eyebrow">Garaje</p>
      <h1>Mo<span class="out">tos</span></h1>
      <p>Cada moto con las medidas de llanta que usa. Toca “Ver llantas” y te mostramos las que le sirven.</p>
    </div>
  </section>

  <div class="bar">
    <div class="wrap bar__in"><div class="chips" id="chips"></div></div>
  </div>

  <section class="section--tight" style="padding-bottom:96px">
    <div class="wrap">
      <p class="count" id="count"></p>
      <div class="grid grid--3" id="grid"></div>
    </div>
  </section>

  <div class="checker" aria-hidden="true"></div>
  <section class="cta">
    <div class="wrap cta__in">
      <div><h2>¿Tu moto no está aquí?</h2><p>Escríbenos el modelo y el año: te decimos qué llantas lleva y te cotizamos.</p></div>
      <div class="cta__btns"><a class="btn btn--lg btn--white" data-wa="Hola Super Llantas, mi moto no aparece en la página y quiero cotizar llantas." target="_blank" rel="noopener"><span>Escribir por WhatsApp</span></a></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
